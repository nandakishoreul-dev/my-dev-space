<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusPulse</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header>
        <div class="logo">
            ⚡ CampusPulse
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#issues">Issues</a>
            <button onclick="showReportForm()">
                Report Issue
            </button>
        </nav>
    </header>


    <main>

        <!-- Hero Section -->

        <section id="home" class="hero">

            <div>
                <p class="tagline">
                    BUILD A BETTER CAMPUS
                </p>

                <h1>
                    Make your campus
                    <span>better.</span>
                </h1>

                <p class="hero-text">
                    Report campus problems, track issues,
                    and help create a better environment
                    for everyone.
                </p>

                <button
                    class="primary-button"
                    onclick="showReportForm()"
                >
                    + Report an Issue
                </button>
            </div>

        </section>


        <!-- Issues Section -->

        <section id="issues" class="issues-section">

            <div class="section-heading">
                <div>
                    <p class="tagline">
                        CAMPUS PULSE
                    </p>

                    <h2>
                        Reported Issues
                    </h2>
                </div>

                <button
                    class="secondary-button"
                    onclick="loadIssues()"
                >
                    Refresh
                </button>
            </div>

            <div
                id="issues-container"
                class="issues-container"
            >
                <p class="loading">
                    Loading issues...
                </p>
            </div>

        </section>


        <!-- Report Form -->

        <section
            id="report-section"
            class="report-section hidden"
        >

            <div class="form-card">

                <div class="section-heading">
                    <div>
                        <p class="tagline">
                            CAMPUSPULSE
                        </p>

                        <h2>
                            Report an Issue
                        </h2>
                    </div>

                    <button
                        class="close-button"
                        onclick="hideReportForm()"
                    >
                        ×
                    </button>
                </div>


                <form id="issue-form">

                    <label for="title">
                        Issue Title
                    </label>

                    <input
                        id="title"
                        type="text"
                        placeholder="Example: Broken fan"
                        required
                    >


                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe the problem..."
                        required
                    ></textarea>


                    <div class="form-row">

                        <div>
                            <label for="category">
                                Category
                            </label>

                            <select id="category">

                                <option>
                                    Electrical
                                </option>

                                <option>
                                    Network
                                </option>

                                <option>
                                    Cleanliness
                                </option>

                                <option>
                                    Infrastructure
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>
                        </div>


                        <div>
                            <label for="priority">
                                Priority
                            </label>

                            <select id="priority">

                                <option>
                                    Low
                                </option>

                                <option selected>
                                    Medium
                                </option>

                                <option>
                                    High
                                </option>

                            </select>
                        </div>

                    </div>


                    <label for="location">
                        Location
                    </label>

                    <input
                        id="location"
                        type="text"
                        placeholder="Example: Room 203"
                        required
                    >


                    <button
                        type="submit"
                        class="primary-button submit-button"
                    >
                        Submit Issue
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer>
        <p>
            CampusPulse © 2026
        </p>

        <p>
            Built with Python & FastAPI
        </p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
